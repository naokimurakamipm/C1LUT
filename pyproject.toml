[project]
name = 'c1lut'
version = '2.0.0'
readme = 'README.md'
requires-python = '>=3.12'
description = 'CUBE LUT to ICC camera-profile pipeline for Capture One: float ICC evaluation, tetrahedral interpolation, native-lcms2 dE2000 validation gate.'
dependencies = [
    'numpy==2.3.5',
    'pillow==12.0.0',
    'colour-science==0.4.6',
]

[project.optional-dependencies]
dev = [
    'pytest==8.3.5',
    'pyinstaller==6.17.0',
]
